<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2a1f3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tamagochi">
  <title>Tamagochi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="device">
    <header class="top">
      <div class="info">
        <strong id="petName">—</strong>
        <span id="petMeta"></span>
      </div>
      <div class="top-btns">
        <button class="icon-btn" id="dexBtn" aria-label="Digidex">📖</button>
        <button class="icon-btn" id="settingsBtn" aria-label="Réglages">⚙️</button>
      </div>
    </header>

    <div class="shell">
      <div class="screen" id="screen">
        <canvas id="lcd" aria-label="Écran du Tamagochi"></canvas>
      </div>
      <p class="bubble" id="bubble" aria-live="polite"></p>
    </div>

    <section class="stats" id="stats">
      <div class="stat" data-key="hunger"><span>🍙 Faim</span><i><b></b></i></div>
      <div class="stat" data-key="happy"><span>💛 Joie</span><i><b></b></i></div>
      <div class="stat" data-key="energy"><span>⚡ Énergie</span><i><b></b></i></div>
      <div class="stat" data-key="clean"><span>🫧 Hygiène</span><i><b></b></i></div>
      <div class="stat" data-key="health"><span>❤️ Santé</span><i><b></b></i></div>
      <p class="record" id="record"></p>
    </section>

    <nav class="actions" id="actions">
      <button data-act="feed"><span>🍙</span>Nourrir</button>
      <button data-act="play"><span>🎾</span>Jouer</button>
      <button data-act="fight"><span>⚔️</span>Combat</button>
      <button data-act="wash"><span>🛁</span>Laver</button>
      <button data-act="heal"><span>💊</span>Soigner</button>
      <button data-act="light"><span id="lightIcon">💤</span><em id="lightLabel">Sieste</em></button>
    </nav>

    <nav class="actions hidden" id="feedMenu"></nav>

    <nav class="actions hidden" id="playMenu">
      <button data-game="guess"><span>🎯</span>Gauche ou droite</button>
      <button data-game="catch"><span>🍎</span><em id="bestCatch">Attrape-fruits</em></button>
      <button data-game="jump"><span>🦘</span><em id="bestJump">Saut</em></button>
      <button data-game="back"><span>↩</span>Retour</button>
    </nav>

    <nav class="actions hidden" id="catchMenu">
      <button id="catchLeft"><span>◀</span>Gauche</button>
      <button id="catchRight"><span>▶</span>Droite</button>
    </nav>

    <nav class="actions hidden" id="jumpMenu">
      <button id="jumpBtn"><span>🦘</span>Sauter !</button>
    </nav>

    <nav class="actions hidden" id="gameMenu">
      <button data-guess="left"><span>⬅️</span>Gauche</button>
      <button data-guess="right"><span>➡️</span>Droite</button>
    </nav>

    <nav class="actions hidden" id="battleMenu">
      <button id="fireBtn"><span>🔥</span>Tirer !</button>
      <button id="fleeBtn"><span>🏳️</span>Fuir</button>
    </nav>
  </main>

  <dialog id="nameDialog">
    <form method="dialog" id="nameForm">
      <h2>🥚 Un nouvel œuf !</h2>
      <p>Comment veux-tu l'appeler ?</p>
      <input id="nameInput" maxlength="12" autocomplete="off" placeholder="Pixel" required>
      <button type="submit">Adopter</button>
    </form>
  </dialog>

  <dialog id="deathDialog">
    <form method="dialog">
      <h2>👻 Repose en paix</h2>
      <p id="deathText"></p>
      <button type="submit">Nouvel œuf</button>
    </form>
  </dialog>

  <dialog id="dexDialog">
    <form method="dialog">
      <h2>📖 Digidex <small id="dexCount"></small></h2>
      <h3>Formes</h3>
      <div class="dex" id="dexForms"></div>
      <h3>Adversaires vaincus</h3>
      <div class="dex" id="dexFoes"></div>
      <button type="submit">Fermer</button>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog">
      <h2>⚙️ Réglages</h2>
      <h3>Couleur de la coque</h3>
      <div class="swatches">
        <button type="button" data-shell-pick="rose" aria-label="Rose"></button>
        <button type="button" data-shell-pick="bleu" aria-label="Bleu"></button>
        <button type="button" data-shell-pick="menthe" aria-label="Menthe"></button>
        <button type="button" data-shell-pick="soleil" aria-label="Soleil"></button>
        <button type="button" data-shell-pick="nuit" aria-label="Nuit"></button>
        <button type="button" data-shell-pick="cristal" aria-label="Cristal"></button>
      </div>
      <label class="setting-row"><span>🔊 Sons</span><input type="checkbox" id="soundToggle"></label>
      <button type="button" class="wide" id="notifBtn">🔔 Activer les notifications</button>
      <p class="note" id="notifNote"></p>
      <button type="button" class="wide danger" id="resetBtn">↺ Recommencer avec un nouvel œuf</button>
      <button type="submit">Fermer</button>
    </form>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
